[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topodyn"
version = "0.1.0"
description = "Planar dynamical systems, stability, and topological index exploration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
topodyn = "topodyn.__main__:main"

[tool.setuptools.packages.find]
include = ["topodyn*"]
