[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="dynamics-topology"
version="0.1.0"
requires-python=">=3.10"
description="Exact linear discrete-time stability with replayable research evidence"
readme="README.md"
license={text="Apache-2.0"}
[project.scripts]
dynamics-topology="dynamics_topology.__main__:main"
researchos="researchos.__main__:main"
[tool.setuptools.packages.find]
include=["dynamics_topology*","researchos*"]
[tool.setuptools.package-data]
researchos=["*.json"]
